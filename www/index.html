<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KoboSense</title><link rel="icon" href="img/kobosense-logo.png"><link rel="stylesheet" href="css/style.css"></head><body>
<div id="authGate" class="gate"><div class="gate-card"><img src="img/kobosense-logo.png" class="gate-logo"><h1>KoboSense Account</h1><p>Create an account or sign in to continue.</p><input id="authName" placeholder="Full name (for new account)"><input id="authEmail" type="email" placeholder="Email"><input id="authPassword" type="password" placeholder="Password (minimum 6 characters)"><div class="form-row"><button id="signUpBtn" class="primary">Create account</button><button id="loginBtn" class="ghost">Sign in</button></div><button id="resetBtn" class="ghost">Forgot password</button><p id="authMsg"></p></div></div>
<div id="onboarding" class="gate" hidden><form id="onboardingForm" class="gate-card"><img src="img/kobosense-logo.png" class="gate-logo"><h1>Set up your KoboSense</h1><label>Full name<input id="fullName" required></label><label>School level<select id="schoolLevel"><option>University</option><option>Polytechnic</option><option>College of Education</option><option>Secondary School</option><option>Other</option></select></label><label>Institution<select id="university"></select></label><label>Current balance<input id="balance" type="number" min="0" required></label><label>Monthly allowance<input id="allowance" type="number" min="1" required></label><button class="primary">Enter KoboSense</button></form></div>
<div id="app" hidden><header class="header"><div class="topbar"><button class="brand" data-tab="home"><img src="img/kobosense-logo.png"><span>KoboSense<small>A smarter you.</small></span></button><button class="profile" data-tab="settings"><span id="avatar">KS</span><span><b id="profileName"></b><small id="profileInfo"></small></span></button></div><div id="health" class="health"><div><b id="modeName"></b><span id="modeText"></span></div><div class="health-track"><i id="healthFill"></i></div></div><nav id="nav"></nav></header><main><section id="home" class="page"></section>
<section id="academics" class="page" hidden><div class="page-title"><div><small>ACADEMIC COMMAND CENTRE</small><h1>Make this semester count.</h1></div><button class="ghost" id="resetSemester">Reset semester</button></div><div class="two-col"><div><div class="section"><h2>Add course</h2><form id="courseForm" class="form-row"><input id="courseCode" placeholder="Course code" required><input id="courseUnit" type="number" min="1" max="12" placeholder="Units" required><select id="courseGrade"><option value="5">A</option><option value="4">B</option><option value="3">C</option><option value="2">D</option><option value="1">E</option><option value="0">F</option></select><input id="courseCA" type="number" min="0" max="30" placeholder="CA /30" required><input id="courseAtt" type="number" min="0" max="100" placeholder="Attendance %" required><button class="primary">Add</button></form></div><div class="section"><div class="split"><h2>Your courses</h2><b id="cgpa"></b></div><div id="courseList"></div></div><div class="section"><h2>Course risk</h2><div class="risk"><i id="riskPin"></i></div></div><div class="section"><button id="generateTimetable" class="primary">Generate smart timetable</button><select id="studyStart"><option value="18:00">Start 6 PM</option></select><select id="sessionLength"><option value="60">60-minute sessions</option></select><select id="studyDays"><option value="5">5 study days</option></select><form id="timetableForm" class="form-row"><input id="studyCourse" required><input id="studyDay" type="date" required><input id="studyTime" type="time" required><button>Add block</button></form><div id="timetableList"></div></div></div><aside><div class="slider" data-slider="academics"></div></aside></div></section>
<section id="finance" class="page" hidden></section><section id="hostel" class="page" hidden><div class="page-title"><h1>Hostel & Lodge Life</h1></div><div class="two-col"><div><div class="section"><form id="roommateForm"><input id="roommateName" required><button>Add roommate</button></form><div id="roommateList"></div></div><div class="section"><form id="utilityForm"><input id="utilityBill" type="number" required><select id="utilityMethod"><option value="equal">Equal split</option><option value="custom">Custom</option></select><button>Calculate</button></form><div id="utilityResult"></div><button id="copyUtility">Copy</button></div><div class="section"><button id="rotateDuties">Rotate duties</button><div id="dutyList"></div></div></div></div></section><section id="hustle" class="page" hidden></section><section id="relationship" class="page" hidden></section><section id="sports" class="page" hidden></section><section id="privacy" class="page prose" hidden></section><section id="about" class="page prose" hidden></section><section id="settings" class="page" hidden><form id="settingsForm" class="settings-grid"><input id="setName"><select id="setLevel"><option>University</option><option>Polytechnic</option><option>Other</option></select><select id="setUniversity"></select><input id="setBalance" type="number"><input id="setAllowance" type="number"><button>Save</button></form><button onclick="KoboCloud.signOut()" type="button" class="ghost">Sign out</button><button id="resetApp" class="danger">Reset local data</button></section></main><div id="modal" class="modal" hidden><div class="modal-card"><div id="modalBody"></div><button id="closeModal">Close</button></div></div><div id="toast" class="toast"></div></div>
<script src="https://www.gstatic.com/firebasejs/12.4.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.4.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore-compat.js"></script><script src="js/state.js"></script><script src="js/storage.js"></script><script src="js/academics.js"></script><script src="js/finance.js"></script><script src="js/hostel.js"></script><script src="js/hustle.js"></script><script src="js/relationship.js"></script><script src="js/sports.js"></script><script src="js/app.js"></script><script src="js/firebase-main.js"></script></body></html>
