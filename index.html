<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UniSteady</title><link rel="icon" href="img/kobosense-logo.png"><link rel="stylesheet" href="css/style.css?v=1793278403"> <style>/* hide extra push */</style>
</head><body>
<div id="appLoading" class="gate"><div class="gate-card"><img src="img/kobosense-logo.png" class="gate-logo" alt="UniSteady"><h1>UniSteady</h1><p>Getting things ready...</p></div></div>
<div id="authGate" class="gate" hidden><div class="gate-card"><img src="img/kobosense-logo.png" class="gate-logo"><h1>UniSteady Account</h1><p>Create an account or sign in to continue.</p><input id="authName" placeholder="Full name (for new account)"><input id="authEmail" type="email" placeholder="Email"><input id="authPassword" type="password" placeholder="Password (minimum 6 characters)"><div class="form-row"><button id="signUpBtn" class="primary">Create account</button><button id="loginBtn" class="ghost">Sign in</button></div><button id="resetBtn" class="ghost">Forgot password</button><p id="authMsg"></p></div></div>
<div id="onboarding" class="gate" hidden><form id="onboardingForm" class="gate-card"><img src="img/kobosense-logo.png" class="gate-logo"><h1>Set up your UniSteady</h1><label>Full name<input id="fullName" required></label><label>School level<select id="schoolLevel"><option>University</option><option>Polytechnic</option><option>College of Education</option><option>Secondary School</option><option>Other</option></select></label><label>Institution<select id="university"></select></label><label>Current balance<input id="balance" type="number" min="0" required></label><label>Monthly allowance<input id="allowance" type="number" min="1" required></label><button class="primary">Enter UniSteady</button></form></div>
<div id="app" hidden><header class="header"><div class="topbar"><button class="brand" data-tab="home"><img src="img/kobosense-logo.png"><span>UniSteady<small>A smarter you.</small></span></button><button class="profile" data-tab="settings"><span id="avatar">US</span><span><b id="profileName"></b><small id="profileInfo"></small></span></button></div><div id="health" class="health"><div><b id="modeName"></b><span id="modeText"></span></div><div class="health-track"><i id="healthFill"></i></div></div><nav id="nav"></nav></header><main>
<section id="home" class="page"></section>
<section id="academics" class="page" hidden><div class="page-title"><div><small>ACADEMIC COMMAND CENTRE</small><h1>Make this semester count.</h1></div><button class="ghost" id="resetSemester">Reset semester</button></div><div class="two-col"><div><div class="section"><h2>Add course</h2><form id="courseForm" class="form-row"><input id="courseCode" placeholder="Course code" required><input id="courseUnit" type="number" min="1" max="12" placeholder="Units" required><select id="courseGrade"><option value="5">A</option><option value="4">B</option><option value="3">C</option><option value="2">D</option><option value="1">E</option><option value="0">F</option></select><input id="courseCA" type="number" min="0" max="30" placeholder="CA /30" required><input id="courseAtt" type="number" min="0" max="100" placeholder="Attendance %" required><button class="primary">Add</button></form></div><div class="section">
